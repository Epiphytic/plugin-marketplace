plugins:
  - name: brains
    description: Structured multi-LLM development workflow with research, planning, and implementation phases
    version: "0.5.0"
    source: community
    category: productivity
    path: null
    repository: https://github.com/Epiphytic/brains
    install: claude plugin install brains@brains
    maintainer: Epiphytic
    status: active
    default_install: required
  - name: hotskills
    description: Discover, activate, and invoke Claude Code skills with security gating. Search skills.sh, activate with audit-based risk filtering, and inject skill context into your sessions automatically.
    version: "0.1.4"
    source: community
    category: productivity
    path: null
    repository: https://github.com/Epiphytic/hotskills
    install: claude plugin install hotskills@hotskills
    maintainer: Epiphytic
    status: active
    default_install: optional
  - name: babelfish
    description: Prompt translation to AISP format for machine-readable documentation
    version: "latest"
    source: community
    category: productivity
    path: null
    repository: https://github.com/Epiphytic/babelfish
    install: claude plugin install babelfish@babelfish
    maintainer: Epiphytic
    status: active
    default_install: optional
